services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      ENVIRONMENT: ${ENVIRONMENT}
      AWS_ONLY_MODE: ${AWS_ONLY_MODE}
      AUTH_PROVIDER: ${AUTH_PROVIDER}
      AI_PROVIDER: ${AI_PROVIDER}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      SMS_PROVIDER: ${SMS_PROVIDER}
      PUSH_PROVIDER: ${PUSH_PROVIDER}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID}
      COGNITO_JWT_ISSUER: ${COGNITO_JWT_ISSUER}
      COGNITO_JWT_AUDIENCE: ${COGNITO_JWT_AUDIENCE}
      GOOGLE_VISION_CREDENTIALS_FILE: /run/secrets/google-vision.json
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      BEDROCK_CHAT_MODEL: ${BEDROCK_CHAT_MODEL}
      BEDROCK_TEXT_MAPPING_ENABLED: ${BEDROCK_TEXT_MAPPING_ENABLED}
      BEDROCK_IMAGE_MODEL: ${BEDROCK_IMAGE_MODEL}
      BEDROCK_IMAGE_REGION: ${BEDROCK_IMAGE_REGION}
      PRODUCT_IMAGE_GENERATION_ENABLED: ${PRODUCT_IMAGE_GENERATION_ENABLED}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS}
      S3_REQUIRE_UPLOAD_SUCCESS: ${S3_REQUIRE_UPLOAD_SUCCESS}
      ASYNC_EXTRACTION_ENABLED: ${ASYNC_EXTRACTION_ENABLED}
      LOCAL_ASYNC_EXTRACTION_WORKER_ENABLED: ${LOCAL_ASYNC_EXTRACTION_WORKER_ENABLED}
      LOCAL_ASYNC_EXTRACTION_POLL_SECONDS: ${LOCAL_ASYNC_EXTRACTION_POLL_SECONDS}
      LOCAL_ASYNC_EXTRACTION_BATCH_SIZE: ${LOCAL_ASYNC_EXTRACTION_BATCH_SIZE}
      ASYNC_EXTRACTION_OCR_MODE: ${ASYNC_EXTRACTION_OCR_MODE}
      SERVICE_CENTER_LIVE_LOOKUP_ENABLED: ${SERVICE_CENTER_LIVE_LOOKUP_ENABLED}
      SERVICE_CENTER_GOOGLE_LOOKUP_ENABLED: ${SERVICE_CENTER_GOOGLE_LOOKUP_ENABLED}
      SES_REGION: ${SES_REGION}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      SNS_REGION: ${SNS_REGION}
      DYNAMODB_MIRROR_ENABLED: ${DYNAMODB_MIRROR_ENABLED}
      DYNAMODB_READ_FALLBACK_ENABLED: ${DYNAMODB_READ_FALLBACK_ENABLED}
      DYNAMODB_DOCUMENTS_TABLE_NAME: ${DYNAMODB_DOCUMENTS_TABLE_NAME}
      DYNAMODB_EXTRACTION_JOBS_TABLE_NAME: ${DYNAMODB_EXTRACTION_JOBS_TABLE_NAME}
    expose:
      - "8000"
    volumes:
      - ${GOOGLE_VISION_CREDENTIALS_HOST_PATH}:/run/secrets/google-vision.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ../../nextjs-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_COGNITO_REGION: ${NEXT_PUBLIC_COGNITO_REGION}
        NEXT_PUBLIC_COGNITO_DOMAIN: ${NEXT_PUBLIC_COGNITO_DOMAIN}
        NEXT_PUBLIC_COGNITO_CLIENT_ID: ${NEXT_PUBLIC_COGNITO_CLIENT_ID}
        NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${NEXT_PUBLIC_COGNITO_REDIRECT_URI}
        NEXT_PUBLIC_COGNITO_LOGOUT_URI: ${NEXT_PUBLIC_COGNITO_LOGOUT_URI}
        NEXT_PUBLIC_COGNITO_SCOPE: ${NEXT_PUBLIC_COGNITO_SCOPE}
        NEXT_PUBLIC_APP_API_BASE_URL: ${NEXT_PUBLIC_APP_API_BASE_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_COGNITO_REGION: ${NEXT_PUBLIC_COGNITO_REGION}
      NEXT_PUBLIC_COGNITO_DOMAIN: ${NEXT_PUBLIC_COGNITO_DOMAIN}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${NEXT_PUBLIC_COGNITO_CLIENT_ID}
      NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${NEXT_PUBLIC_COGNITO_REDIRECT_URI}
      NEXT_PUBLIC_COGNITO_LOGOUT_URI: ${NEXT_PUBLIC_COGNITO_LOGOUT_URI}
      NEXT_PUBLIC_COGNITO_SCOPE: ${NEXT_PUBLIC_COGNITO_SCOPE}
      NEXT_PUBLIC_APP_API_BASE_URL: ${NEXT_PUBLIC_APP_API_BASE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      BACKEND_API_BASE_URL: http://backend:8000
      BACKEND_API_SERVICE_TOKEN: ${BACKEND_API_SERVICE_TOKEN}
      BACKEND_API_TIMEOUT_MS: ${BACKEND_API_TIMEOUT_MS}
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_DOMAIN: ${COGNITO_DOMAIN}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      COGNITO_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET}
      COGNITO_REDIRECT_URI: ${COGNITO_REDIRECT_URI}
      COGNITO_LOGOUT_URI: ${COGNITO_LOGOUT_URI}
      COGNITO_SCOPE: ${COGNITO_SCOPE}
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
